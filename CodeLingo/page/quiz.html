<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Тест</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .progress-bar {
            width: 100%;
            height: 12px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        #progressFill {
            height: 100%;
            width: 0%;
            background: #00bfff;
            transition: width 0.3s ease;
        }

        .draggable:hover {
            border-color: #00bfff;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
        }

        .question {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .answer {
            padding: 15px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .draggable {
            padding: 15px;
            background: white;
            border-radius: 10px;
            cursor: grab;
            margin-bottom: 10px;
            border: 2px solid #ddd;
        }

        .dragging {
            opacity: 0.5;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border-radius: 10px;
        }

        .btn {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #00bfff;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-right: 15px;
        }

        .btn:hover {
            background: #009acd;
        }

        /* ===== БАЗА КРАЩЕ ВИГЛЯДАЄ ===== */
        body {
            background: #f7f7fb;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        /* питання */
        .question {
            font-size: 24px;
            font-weight: 600;
        }

        /* відповіді як карточки */
        .answer {
            padding: 18px;
            border-radius: 15px;
            border: 2px solid #eee;
            transition: 0.2s;
        }

        .answer:hover {
            border-color: #00bfff;
            transform: scale(1.01);
        }

        /* drag елементи */
        .draggable {
            border-radius: 15px;
        }

        /* textarea */
        textarea {
            font-size: 16px;
        }

        /* кнопка */
        .btn {
            border-radius: 15px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px auto;
            }

            .question {
                font-size: 22px;
            }
        }
        @media (max-width: 480px) {

            .container {
                margin: 10px;
                padding: 18px;
            }

            /* питання */
            .question {
                font-size: 24px;
                margin-bottom: 20px;
                line-height: 1.3;
            }

            /* відповіді */
            .answer {
                padding: 20px;
                font-size: 18px;
                border-radius: 18px;
            }

            /* drag елементи */
            .draggable {
                padding: 18px;
                font-size: 18px;
                border-radius: 18px;
            }

            /* textarea */
            textarea {
                height: 130px;
                font-size: 16px;
                padding: 15px;
                border-radius: 15px;
            }

            .btn {
                font-size: 20px;
                padding: 16px;
                border-radius: 16px;
            }

            .progress-bar,
            .quiz-progress-container {
                height: 14px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="quiz-progress-container" style="width: 100%; background: white; height: 10px; border-radius: 5px; margin-bottom: 20px;">
        <div id="quizProgressFill" style="width: 0; height: 100%; background: #00bfff; border-radius: 5px; transition: width 0.3s ease;"></div>
    </div>

    <div class="question" id="questionText"></div>

    <div id="answersContainer"></div>

    <button class="btn" onclick="checkAnswer()">Перевірити</button>

</div>

<script src="../js/quiz.js"></script>
</body>
</html>
