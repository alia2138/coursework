<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLingo</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/home.css">

    <style>
        .menu-item.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="layout">

    <aside class="sidebar">

        <div class="sidebar-top">
            <h1 class="logo">CodeLingo</h1>

            <div class="menu" id="courseMenu"></div>
        </div>

        <div class="sidebar-bottom">
            <button class ="profile-btn" onclick="goToProfile()">Профіль</button>
            <button class ="shop-btn" onclick="goToShop()">Магазин</button>
        </div>

    </aside>

    <main class="main">

        <div class="topbar">
            <div class="stat">🔥 <span id="streak">0</span></div>
            <div class="stat">❤️ <span id="hearts">0</span></div>
            <div class="stat">💎 <span id="diamonds">0</span></div>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>
            <p id="progressText">Прогрес: 0%</p>
        </div>

        <div class="levels-container" id="levelsContainer"></div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/main.js"></script>
<script src="../js/home.js"></script>

</body>
</html>
